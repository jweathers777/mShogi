"1,1" = "wP"
"1,2" = "wP"
"1,3" = "wP"
"1,4" = "wP"
"1,5" = "wP"
"1,6" = "wP"
"1,7" = "wP"
"6,0" = "bP"
"6,1" = "bP"
"6,2" = "bP"
"6,3" = "bP"
"6,4" = "bP"
"6,5" = "bP"
"6,6" = "bP"
"6,7" = "bP"
"7,0" = "bR"
"7,1" = "bN"
"7,2" = "bB"
"7,3" = "bQ"
"7,4" = "bK"
"7,5" = "bB"
"7,6" = "bN"
"7,7" = "bR"

[rules.invalid_move_conditions]
move_puts_own_king_into_check = true

[rules.end_conditions]
allow_draw_offer = true
allow_resignation = true
checkmate_is_win = true
end_by_time = true
fifty_moves_draw = true
insufficient_material_is_draw = true
stalemate_is_draw = true
threefold_repetition_is_draw = true
