[package]
name = "mshogi-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mshogi"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.145"
mshogi-engine = { path = "../mshogi-engine" }
mshogi-core = { path = "../mshogi-core" }
mshogi-search = { path = "../mshogi-search" }

[lints]
workspace = true

# Separate verification helper; desktop packaging selects only the mshogi binary.
[[bin]]
name = "mshogi-internal-fixture"
path = "tests/support/internal_fixture.rs"
test = false
doc = false

