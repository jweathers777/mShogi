[workspace]
members = ["crates/mshogi-core", "crates/mshogi-console", "crates/mshogi-search", "crates/mshogi-runner", "crates/mshogi-engine", "crates/mshogi-desktop-session"]
exclude = ["desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
