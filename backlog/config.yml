project_name: "mShogi"
default_status: "To Do"
statuses: ["To Do", "Ready", "In Progress", "In Review", "Done"]
labels: []
definition_of_done:
  - "Acceptance criteria have supporting evidence; failed or unavailable checks are not presented as passed."
  - "Applicable independent review is recorded and material findings are resolved."
  - "Relevant documentation and follow-up tasks are current."
  - "The result is integrated into the recorded rewrite branch with a durable completion or handoff summary."
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "msh"
