[package]
name = "mshogi-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mshogi-match"
path = "src/main.rs"

[[bin]]
name = "mshogi-runner-fixture"
path = "tests/support/uci_fixture.rs"
test = false
doc = false

[dependencies]
mshogi-core = { path = "../mshogi-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lints]
workspace = true

# Verification process only; desktop packages select the production mshogi binary.
[[bin]]
name = "mshogi-usi-fixture"
path = "tests/support/usi_fixture.rs"
test = false
doc = false
