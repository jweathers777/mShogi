name = "Chess"
style = "Chess"
board_size = [8, 8]
player_names = ["White", "Black"]

[piece_types.Pawn]
symbol = "P"
moves = [
  "forward_one_no_capture",
  "first_forward_two_no_capture",
  "en_passant", 
  "diagonal_capture"
]
promotion = ["Queen", "Rook", "Bishop", "Knight"]

[piece_types.Knight]
symbol = "N"
moves = ["orthogonal_one_diagonal_one_jump"]

[piece_types.Bishop]
symbol = "B"
moves = ["diagonal"]

[piece_types.Rook]
symbol = "R"
moves = ["orthogonal"]

[piece_types.Queen]
symbol = "Q"
moves = ["any_direction"]

[piece_types.King]
symbol = "K"
moves = ["adjacent", "castle_kingside", "castle_queenside"]

[starting_position]
"0,0" = "wR"
"0,1" = "wN"
"0,2" = "wB"
