[package]
name = "mshogi-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]
resolver = "3"

[features]
# Explicitly separate verification builds; absent from normal distributables.
desktop-verification = ["mshogi-desktop-session/desktop-verification"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
mshogi-desktop-session = { path = "../../crates/mshogi-desktop-session" }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Keep native macOS Quit on the same preventable path as window close.
tao = { path = "vendor/tao" }
