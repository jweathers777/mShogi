[package]
name = "mshogi-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[features]
# Explicitly separate verification builds; absent from normal distributables.
desktop-verification = ["mshogi-desktop-session/desktop-verification"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
mshogi-desktop-session = { path = "../../crates/mshogi-desktop-session" }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Keep macOS Dock Quit, logout and shutdown on the same preventable path as
# window close. The fork carries one patch on tao 0.37.2; drop it when the
# upstream change is released.
tao = { git = "https://github.com/jweathers777/tao", rev = "97dd48097e8d3c9fd2e68f01bdf75e3ccce0db9b" }
