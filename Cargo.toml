[workspace]
members = ["crates/mshogi-core", "crates/mshogi-console", "crates/mshogi-search"]
exclude = ["legacy/rust-prototype"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
